# Mapeo ANTIGUO (pre-perfiles de contexto) para pruebas de regresion.
# A=A, B=B, Select(Boton Back)=Z, X=C-Left, Y=C-Up, LB=L, RB=R, start=START, sin stick derecho.
[game]
a = A
b = B
x = CLEFT
y = CUP
lb = L
rb = R
back = Z
start = START
dup = DUP
ddown = DDOWN
dleft = DLEFT
