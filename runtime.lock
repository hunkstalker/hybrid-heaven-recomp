# Pin del runtime del port (forks propios, rama hybrid-heaven).
#
# DESDE LA MIGRACION A SUBMODULOS (ADR 0010) EL PIN CANONICO ES EL GITLINK + .gitmodules del
# superproyecto: `git submodule update --init --recursive` trae la version correcta. Este fichero
# queda como REFERENCIA (URL+commit legibles) y como FALLBACK de los scripts si `lib/` no existe
# y el `git submodule update` no puede resolver (p.ej. commit del fork aun sin publicar).
#
# Para probar el arbol local sin publicar: port/build_windows.local.bat (Windows, no toca git) o
# tools/build_linux.sh sin --force-libs (si lib/ ya existe, no toca git).
#
# Los commits de los forks deben existir en el remoto para que un clon limpio/submodulo funcione:
# orden de push N64Recomp -> N64ModernRuntime -> main (ver AGENTS.md).
NMR_URL=https://github.com/hunkstalker/N64ModernRuntime.git
NMR_COMMIT=c03646f4e67f3af6c7bfd0081d8d4c15e64cd350
# Referencia (los resuelve el .gitmodules anidado del fork NMR; se listan para trazabilidad):
N64RECOMP_URL=https://github.com/hunkstalker/N64Recomp.git
