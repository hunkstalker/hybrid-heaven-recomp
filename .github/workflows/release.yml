name: Release

# Publica binarios listos para usar (Windows .zip y Linux .tar.gz) y la imagen de ejecucion en
# ghcr.io. La ROM NO se incluye: el .exe la pide en runtime al usuario.
#
#   git tag v0.1.0 && git push origin v0.1.0
# (o lanzar el workflow a mano con "Run workflow")

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (zip)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        env:
          CI: '1'
        run: cmd /c port\build_windows.bat
      - name: Empaquetar
        shell: pwsh
        run: |
          $dir = "port/HybridHeavenRecomp/build_win/bin/Release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$dir/Hybrid Heaven Recomp.exe" dist/
          Copy-Item "$dir/*.dll" dist/
          Copy-Item "port/README_windows.md" dist/LEEME.txt
          Copy-Item "CREDITS.md" dist/CREDITOS.md
          Compress-Archive -Path "dist/*" -DestinationPath "dist/HybridHeavenRecomp-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: HybridHeavenRecomp-Windows
          path: dist/HybridHeavenRecomp-Windows.zip
          if-no-files-found: error

  linux:
    name: Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen (stage "build")
        run: docker build --target build -t hh-build .
      - name: Extraer binario y empaquetar
        run: |
          set -e
          mkdir -p dist/HybridHeavenRecomp-Linux
          cid=$(docker create hh-build)
          docker cp "$cid:/out/Hybrid Heaven Recomp" "dist/HybridHeavenRecomp-Linux/"
          docker rm "$cid"
          cp port/README_linux.md dist/HybridHeavenRecomp-Linux/LEEME.txt
          cp CREDITS.md dist/HybridHeavenRecomp-Linux/CREDITOS.md
          tar -C dist -czf dist/HybridHeavenRecomp-Linux.tar.gz HybridHeavenRecomp-Linux
      - uses: actions/upload-artifact@v4
        with:
          name: HybridHeavenRecomp-Linux
          path: dist/HybridHeavenRecomp-Linux.tar.gz
          if-no-files-found: error

  image:
    name: Imagen de ejecucion (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publicar release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear release con los artefactos
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
