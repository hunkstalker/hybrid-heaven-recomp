name: Release

# NO recompila (build once, promote): descarga los artefactos que CI ya genero y valido para el
# commit y publica el Release; la imagen ghcr se monta desde ese binario. Ver docs/adr/0005.
# Dos formas:
#   1) Con tag:   git tag -a v0.1.1 -m v0.1.1 && git push origin v0.1.1
#   2) A mano:    Actions -> Release -> Run workflow -> escribe la version (p.ej. v0.1.1)
#                 (crea el Release y el tag automaticamente en el commit actual)
# Requiere que CI haya pasado para ese commit (si no, el publish falla con un aviso claro).
# La ROM NO se incluye: el .exe la pide en runtime al usuario.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version del release (p.ej. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

env:
  # Tag empujado -> su nombre; manual -> lo que escribas.
  HH_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  publish:
    name: Publicar release (artefactos de CI)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Localizar el run de CI de este commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" \
                 --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::No hay un run de CI exitoso para $GITHUB_SHA. Sube el commit a main y espera a que CI pase antes de publicar."
            exit 1
          fi
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
          merge-multiple: true
      - name: Crear release (y su tag si no existia)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$HH_VERSION" dist/* --target "$GITHUB_SHA" --generate-notes --title "$HH_VERSION"

  image:
    name: Imagen ghcr (desde el binario de CI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Localizar el run de CI de este commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$GITHUB_SHA" \
                 --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::No hay un run de CI exitoso para $GITHUB_SHA."
            exit 1
          fi
          echo "run_id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: HybridHeavenRecomp-Linux
          run-id: ${{ steps.ci.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist
      - name: Preparar contexto (binario + entrypoint)
        run: |
          set -e
          mkdir -p imgctx
          tar -xzf dist/HybridHeavenRecomp-Linux.tar.gz -C imgctx
          cp docker/entrypoint.sh imgctx/
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: imgctx
          file: ./docker/Dockerfile.runtime
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.HH_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
