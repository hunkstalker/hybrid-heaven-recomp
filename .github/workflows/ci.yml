name: CI

# Flujo unico de compilacion ("build once, promote"):
#   - CI compila en cada push a main / PR y sube ARTEFACTOS (zip Windows + tar.gz Linux).
#   - release.yml NO recompila: descarga los artefactos de CI de ESE commit y publica el Release
#     (y monta la imagen ghcr desde el binario). Ver docs/adr/0005.
#
# El C recompilado NO se versiona (ADR 0009). Para compilar en CI, los jobs `linux`/`windows` lo
# traen de un **repo privado de secretos** (patron Goemon/Zelda64Recomp): se clona con un PAT
# (secreto `HH_SECRETS_PAT`) y se copia `RecompiledFuncs/` a `build/recomp/`.
# Configuracion: variable `HH_SECRETS_REPO` (por defecto `hunkstalker/hh-recomp-secrets`) + secreto
# `HH_SECRETS_PAT` (fine-grained, Contents:Read sobre ese repo). Si falta el PAT, los builds se
# SALTAN (CI verde) con un aviso; no hay ROM ni C en este repo publico.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs (indice y enlaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docs/INDEX.md (enlaces y presupuestos)
        run: python3 tools/analysis/docs_index.py --check

  linux:
    name: Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Traer el C recompilado (repo privado de secretos; ADR 0009)
        id: prep
        shell: bash
        env:
          PAT: ${{ secrets.HH_SECRETS_PAT }}
          REPO: ${{ vars.HH_SECRETS_REPO }}
        run: |
          set -e
          if [ -z "$PAT" ]; then
            echo "::warning::Sin HH_SECRETS_PAT: no se compila el port (el C recompilado no se versiona; ADR 0009). Configura el repo de secretos o compila en local."
            echo "have=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ -n "$REPO" ] || REPO="hunkstalker/hh-recomp-secrets"
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/${REPO}.git" secrets
          mkdir -p build/recomp/rsp
          cp -r secrets/RecompiledFuncs build/recomp/RecompiledFuncs
          cp secrets/rsp/hh_aspMain.cpp build/recomp/rsp/hh_aspMain.cpp
          echo "have=1" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.prep.outputs.have == '1'
      - name: Compilar el port (stage "build")
        if: steps.prep.outputs.have == '1'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: false
          load: true
          tags: hh-build:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Empaquetar (binario + LEEME + creditos)
        if: steps.prep.outputs.have == '1'
        run: |
          set -e
          mkdir -p dist/HybridHeavenRecomp-Linux
          cid=$(docker create hh-build:ci)
          # En la imagen el binario va sin espacios (buildx no parsea COPY con comillas+espacios);
          # en el artefacto lo dejamos con el nombre "bonito".
          docker cp "$cid:/out/hybrid-heaven-recomp" "dist/HybridHeavenRecomp-Linux/Hybrid Heaven Recomp"
          docker rm "$cid"
          cp docs/BUILDING_linux.md dist/HybridHeavenRecomp-Linux/LEEME.txt
          cp CREDITS.md dist/HybridHeavenRecomp-Linux/CREDITOS.md
          cp LICENSE dist/HybridHeavenRecomp-Linux/LICENCIA.txt
          # Carpeta guia para la ROM del usuario (el juego no la incluye).
          mkdir -p dist/HybridHeavenRecomp-Linux/rom
          printf '%s\n' \
            'Coloca aqui tu ROM de Hybrid Heaven (USA, NHVE, 16 MB).' \
            '' \
            '  Nombre esperado:  rom/baserom.us.z64' \
            '' \
            'El juego NO incluye la ROM (copyright de Konami): la aporta cada usuario.' \
            'Ver LEEME.txt para mas detalles.' \
            > dist/HybridHeavenRecomp-Linux/rom/PON_AQUI_LA_ROM.txt
          tar -C dist -czf dist/HybridHeavenRecomp-Linux.tar.gz HybridHeavenRecomp-Linux
      - uses: actions/upload-artifact@v4
        if: steps.prep.outputs.have == '1'
        with:
          name: HybridHeavenRecomp-Linux
          path: dist/HybridHeavenRecomp-Linux.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    # Build pesado (MSVC): no en PRs.
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Traer el C recompilado (repo privado de secretos; ADR 0009)
        id: prep
        shell: bash
        env:
          PAT: ${{ secrets.HH_SECRETS_PAT }}
          REPO: ${{ vars.HH_SECRETS_REPO }}
        run: |
          set -e
          if [ -z "$PAT" ]; then
            echo "::warning::Sin HH_SECRETS_PAT: se omite el build de Windows (el C recompilado no se versiona; ADR 0009)."
            echo "have=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ -n "$REPO" ] || REPO="hunkstalker/hh-recomp-secrets"
          git clone --depth 1 "https://x-access-token:${PAT}@github.com/${REPO}.git" secrets
          mkdir -p build/recomp/rsp
          cp -r secrets/RecompiledFuncs build/recomp/RecompiledFuncs
          cp secrets/rsp/hh_aspMain.cpp build/recomp/rsp/hh_aspMain.cpp
          echo "have=1" >> "$GITHUB_OUTPUT"
      - name: Compilar (clona deps por runtime.lock + MSVC)
        if: steps.prep.outputs.have == '1'
        env:
          CI: '1'
        run: cmd /c build_windows.bat
      - name: Empaquetar (exe + DLLs + LEEME + creditos)
        if: steps.prep.outputs.have == '1'
        shell: pwsh
        run: |
          $dir = "build/windows/bin/Release"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "$dir/Hybrid Heaven Recomp.exe" dist/
          Copy-Item "$dir/*.dll" dist/
          Copy-Item "docs/BUILDING_windows.md" dist/LEEME.txt
          Copy-Item "CREDITS.md" dist/CREDITOS.md
          Copy-Item "LICENSE" dist/LICENCIA.txt
          # Carpeta guia para la ROM del usuario (el juego no la incluye).
          New-Item -ItemType Directory -Force -Path dist/rom | Out-Null
          @(
            'Coloca aqui tu ROM de Hybrid Heaven (USA, NHVE, 16 MB).',
            '',
            '  Nombre esperado:  rom\baserom.us.z64',
            '',
            'El juego NO incluye la ROM (copyright de Konami): la aporta cada usuario.',
            'Ver LEEME.txt para mas detalles.'
          ) | Set-Content -Encoding UTF8 dist/rom/PON_AQUI_LA_ROM.txt
          Compress-Archive -Path "dist/*" -DestinationPath "dist/HybridHeavenRecomp-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        if: steps.prep.outputs.have == '1'
        with:
          name: HybridHeavenRecomp-Windows
          path: dist/HybridHeavenRecomp-Windows.zip
          if-no-files-found: error
