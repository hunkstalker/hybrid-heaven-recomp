# N64Recomp en ELF mode (via de la referencia; ADR 0011).
# Entrada: elf/hybrid-heaven.us.elf (tools/build_elf.sh), byte-identico a la imagen expandida.
# Los patches se anaden tras validar el rc=0 inicial.

[input]
elf_path = "../elf/hybrid-heaven.us.elf"
entrypoint = 0x80000400
use_lookup_for_all_function_calls = true
output_func_path = "../work/recomp_elf/RecompiledFuncs"
functions_per_output_file = 200
relocatable_sections_path = "overlays.txt"

[patches]
stubs = []
ignored = []
