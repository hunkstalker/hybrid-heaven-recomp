# Hybrid Heaven Recomp — contenedores de build y ejecucion (Linux).
#
# La ROM NO se distribuye: ponla en la carpeta `rom/` del repo.
#
#   docker compose build run                       # construye la imagen
#   docker compose run --rm build                  # (opcional) compila y deja el binario en la imagen
#   docker compose run --rm run                    # ejecuta (GUI; en Linux: ver README para X11/GPU)
#   HH_HEADLESS=1 docker compose run --rm run      # smoke headless (Xvfb + lavapipe)
#
# Para GPU/X11 en un host Linux, anade al servicio `run`:
#   devices: ["/dev/dri"]
#   environment: [DISPLAY, ...]
#   volumes: [ "<socket X11 del sistema>:.X11-unix:rw" ]   (consulta la doc de Docker para tu SO)

services:
  build:
    build:
      context: .
      target: build
    image: hybrid-heaven-recomp-builder

  run:
    build:
      context: .
      target: runtime
    image: hybrid-heaven-recomp
    environment:
      - HH_HEADLESS=${HH_HEADLESS:-0}
      - SDL_AUDIODRIVER=${SDL_AUDIODRIVER:-}
    volumes:
      - ./rom:/work/rom:ro
      - ./saves:/work/saves
