# Config combinada: imagen plana + módulo idx 7 como segunda sección.
# Ver notes/2026-09-11-modulo-idx7-extraccion.md y TODO B9.

[input]
entrypoint = 0x80000400
output_func_path = "RecompiledFuncs_combined"
relocatable_sections_path = ""
symbols_file_path = "us_combined.syms.toml"
rom_file_path = "../work/scratch/us_combined.z64"
use_lookup_for_all_function_calls = true

[patches]
stubs = [
]

ignored = [
    "FUN_800493c4",
    "FUN_80049430",
    "FUN_80049538",
    "FUN_800495ec",
]

# HH fix: FUN_80125814's resource-registration step branches on the value returned by
# FUN_80017064, but in the recompiled port that value is unstable (it takes the "already
# registered" path even when the lookup returned -1), so entries 0x18/0x91 are never
# registered and the game later crashes looking them up. Patch `bne $v0,$at,L_80125954`
# (0x8012591C) to a nop so the not-found/registration path is always taken; the game then
# re-checks for id 0 and already-present entries are idempotent through the insert helper.
[[patches.instruction]]
vram = 0x8012591C
func = "M7_FUN_80125814"
value = 0x00000000

